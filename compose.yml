services:
  node-app:
    image: node:22-alpine
    container_name: farmashop-node-app
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - farmashop

volumes:
  node_modules:

networks:
  farmashop: